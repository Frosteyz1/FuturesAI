[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replay-engine"
version = "0.1.0"
description = "Phase 1.5 mass calibration backtest pipeline for AI-Vision Trading Copilot"
requires-python = ">=3.11"
authors = [{ name = "Kevin Zaldrian", email = "kevinzaldrian@gmail.com" }]
license = { text = "Proprietary" }

dependencies = [
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",          # parquet IO

    # Vendor SDKs
    "databento>=0.50",
    "supabase>=2.5",
    "anthropic>=0.40",        # Stage 5 report-card generation only

    # Rendering pipeline (Stage 2)
    "playwright>=1.45",

    # Indicators / math
    "scikit-learn>=1.4",      # isotonic regression, calibration
    "scipy>=1.13",

    # Plotting (Stage 5)
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # Config / CLI
    "pydantic>=2.7",          # type-safe config models
    "python-dotenv>=1.0",
    "click>=8.1",             # CLI wrappers for run_stage* scripts

    # Logging / observability
    "structlog>=24.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
    "ipython>=8.20",
]

modal = [
    "modal>=0.65",            # Modal.com deployment
]

[tool.hatch.build.targets.wheel]
packages = ["src/replay_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]   # line-length handled by formatter

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
strict = ["src/replay_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
